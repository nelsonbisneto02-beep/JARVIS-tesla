<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JARVIS — Tesla por Gestos</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#02070b;color:#eaf8ff;font-family:system-ui,Arial,sans-serif;overflow:hidden}
  #app{height:100vh;position:relative;background:radial-gradient(circle at 50% 45%,#123246,#02070b 68%)}
  video{display:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
  .panel{background:rgba(3,14,22,.78);border:1px solid #23536b;border-radius:14px;padding:9px 12px;backdrop-filter:blur(8px);font-size:13px}
  #status{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(3,14,22,.82);border:1px solid #23536b;border-radius:999px;padding:10px 16px;text-align:center;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
  #start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #35b9ff;background:#09283a;color:#eaf8ff;border-radius:16px;padding:16px 22px;font-size:17px;font-weight:700}
  #help{position:absolute;left:12px;bottom:70px;max-width:330px;font-size:12px;color:#9db8c7;background:rgba(3,14,22,.62);padding:9px 11px;border-radius:12px}
  .ok{color:#8de2ff}.warn{color:#ffd18a}
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="panel"><b>JARVIS</b><br><span id="mode">Aguardando câmera</span></div>
    <div class="panel">TESLA • <span id="angle">0°</span></div>
  </div>
  <button id="start">🎥 Ativar câmera e iniciar</button>
  <div id="help">☝️ Aponte o indicador para controlar o carro.<br>🤏 Pinça (polegar + indicador) para “pegar” e girar.</div>
  <div id="status">JARVIS: pronto, senhor.</div>
</div>

<script type="module">
import {FilesetResolver, HandLandmarker}
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const start=document.getElementById('start');
const statusEl=document.getElementById('status');
const modeEl=document.getElementById('mode');
const angleEl=document.getElementById('angle');

let handLandmarker=null, stream=null, raf=0;
let rot=0, scale=1, grabbed=false, lastX=null;

function status(t){statusEl.textContent="JARVIS: "+t}
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize); resize();

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function drawScene(lm){
  const w=innerWidth,h=innerHeight;
  ctx.clearRect(0,0,w,h);

  // futuristic floor
  ctx.save();
  ctx.globalAlpha=.22;
  ctx.strokeStyle="#35b9ff";
  ctx.lineWidth=1;
  const gy=h*.62;
  for(let y=gy;y<h;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  for(let x=-w;x<2*w;x+=55){ctx.beginPath();ctx.moveTo(w/2+(x-w/2)*.25,gy);ctx.lineTo(x,h);ctx.stroke()}
  ctx.restore();

  const cx=w/2, cy=h*.52;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot*Math.PI/180);
  ctx.scale(scale,scale);

  // hologram rings
  ctx.strokeStyle="rgba(53,185,255,.45)";
  ctx.lineWidth=2;
  for(const r of [105,125,145]){ctx.beginPath();ctx.ellipse(0,62,r,22,0,0,Math.PI*2);ctx.stroke()}

  // stylized Tesla-like hologram
  ctx.strokeStyle="#63d5ff";
  ctx.fillStyle="rgba(31,111,145,.20)";
  ctx.lineWidth=3;
  ctx.shadowColor="#35b9ff";ctx.shadowBlur=18;
  ctx.beginPath();
  ctx.moveTo(-120,45);ctx.quadraticCurveTo(-110,0,-65,-5);
  ctx.quadraticCurveTo(-25,-45,35,-40);
  ctx.quadraticCurveTo(85,-32,112,10);
  ctx.quadraticCurveTo(128,20,132,45);
  ctx.lineTo(105,52);ctx.quadraticCurveTo(95,20,65,25);
  ctx.quadraticCurveTo(45,28,40,53);
  ctx.lineTo(-48,53);ctx.quadraticCurveTo(-55,24,-82,25);
  ctx.quadraticCurveTo(-110,28,-114,52);ctx.closePath();ctx.fill();ctx.stroke();

  ctx.shadowBlur=0;
  ctx.beginPath();ctx.moveTo(-55,-4);ctx.lineTo(-25,-31);ctx.lineTo(34,-28);ctx.lineTo(65,5);ctx.closePath();ctx.stroke();
  ctx.strokeStyle="#b7efff";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(100,20);ctx.lineTo(124,25);ctx.stroke();

  // wheels
  for(const x of [-82,82]){ctx.strokeStyle="#63d5ff";ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,52,18,0,Math.PI*2);ctx.stroke()}
  ctx.restore();

  if(lm){
    const ix=lm[8].x*w, iy=lm[8].y*h;
    ctx.fillStyle="#b7efff";ctx.shadowColor="#35b9ff";ctx.shadowBlur=15;
    ctx.beginPath();ctx.arc(ix,iy,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
  angleEl.textContent=Math.round(((rot%360)+360)%360)+"°";
}

async function init(){
  start.disabled=true;
  status("solicitando acesso à câmera…");
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=stream; await video.play();

    const vision=await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );
    handLandmarker=await HandLandmarker.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO",
      numHands:1,
      minHandDetectionConfidence:.55,
      minHandPresenceConfidence:.55,
      minTrackingConfidence:.55
    });
    start.style.display="none";
    modeEl.innerHTML='<span class="ok">Câmera + mãos ativos</span>';
    status("aponte o indicador para o Tesla; faça uma pinça para girar.");
    loop();
  }catch(e){
    console.error(e);
    start.disabled=false;
    modeEl.innerHTML='<span class="warn">Câmera não ativada</span>';
    status("não consegui acessar a câmera. Permita a câmera no navegador.");
  }
}

function loop(){
  if(!handLandmarker)return;
  const now=performance.now();
  const res=handLandmarker.detectForVideo(video,now);
  const lm=res.landmarks?.[0];
  if(lm){
    const pinch=dist(lm[4],lm[8])<.055;
    const x=1-lm[8].x; // espelha para controle natural
    if(pinch && !grabbed){grabbed=true;lastX=x;status("pinça detectada — girando.");}
    if(!pinch && grabbed){grabbed=false;lastX=null;status("soltou.");}
    if(grabbed && lastX!==null){rot+=(x-lastX)*420;lastX=x;}
    modeEl.textContent=grabbed?"Pinça • controle ativo":"Mão detectada";
    drawScene(lm);
  }else{
    modeEl.textContent="Procurando sua mão…";
    drawScene(null);
  }
  raf=requestAnimationFrame(loop);
}
start.addEventListener("click",init);
</script>
</body>
</html>
